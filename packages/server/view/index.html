<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{#if form}}{{#if form.settings.metaTitle}}{{form.settings.metaTitle}}{{else}}{{form.name}}{{/if}}{{else if title}}{{title}}{{else}}Logisaar Forms{{/if}}</title>
  
  <meta name="description" content="{{#if form}}{{#if form.settings.metaDescription}}{{form.settings.metaDescription}}{{else}}{{form.description}}{{/if}}{{else if description}}{{description}}{{else}}Create and share forms easily with Logisaar Forms.{{/if}}" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Logisaar Forms" />
  <meta property="og:title" content="{{#if form}}{{#if form.settings.metaTitle}}{{form.settings.metaTitle}}{{else}}{{form.name}}{{/if}}{{else if title}}{{title}}{{else}}Logisaar Forms{{/if}}" />
  <meta property="og:description" content="{{#if form}}{{#if form.settings.metaDescription}}{{form.settings.metaDescription}}{{else}}{{form.description}}{{/if}}{{else if description}}{{description}}{{else}}Create and share forms easily with Logisaar Forms.{{/if}}" />
  {{#if ogImage}}
  <meta property="og:image" content="{{ogImage}}" />
  {{/if}}

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{#if form}}{{#if form.settings.metaTitle}}{{form.settings.metaTitle}}{{else}}{{form.name}}{{/if}}{{else if title}}{{title}}{{else}}Logisaar Forms{{/if}}" />
  <meta name="twitter:description" content="{{#if form}}{{#if form.settings.metaDescription}}{{form.settings.metaDescription}}{{else}}{{form.description}}{{/if}}{{else if description}}{{description}}{{else}}Create and share forms easily with Logisaar Forms.{{/if}}" />
  {{#if ogImage}}
  <meta name="twitter:image" content="{{ogImage}}" />
  {{/if}}

  <link href="https://cdnjs.cloudflare.com" rel="dns-prefetch" />
  <link href="https://js.stripe.com" rel="dns-prefetch" />
  {{#if heyform.enableGoogleFonts}}
  <link href="https://fonts.gstatic.com" rel="dns-prefetch" />
  {{/if}}
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta content="Logisaar Forms" name="application-name" />
  <meta content="yes" name="mobile-web-app-capable" />
  <meta content="yes" name="apple-mobile-web-app-capable" />
  <meta content="white" name="apple-mobile-web-app-status-bar-style" />
  <meta content="#fff" name="theme-color" />
  <meta content="Logisaar Forms" name="apple-mobile-web-app-title" />
  <meta content="telephone=no,email=no" name="format-detection" />
  <meta content="on" http-equiv="x-dns-prefetch-control" />
  <link href="/static/favicon.ico" rel="shortcut icon" />
  <link href="/static/favicon.svg" rel="mask-icon" />
  <link href="/static/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
  <link href="/static/initial.css" rel="stylesheet" />
  <link href="/static/manifest.webmanifest" rel="manifest" />
  <link defer href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/4.1.5/css/flag-icons.min.css" rel="stylesheet" />

  <script id="heyform-data" type="application/json">
    {{{json heyform}}}
  </script>

  <script>
		;(function () {
			const userAgent = window.navigator.userAgent;
			const heyform = JSON.parse(document.getElementById('heyform-data').textContent);

			heyform.device = {
				ios: /iPad|iPhone|iPod/i.test(userAgent),
				android: /Android/i.test(userAgent),
				mobile: /Android|iPad|iPhone|iPod/i.test(userAgent),
				windowHeight: window.innerHeight,
				screenHeight: window.screen.height,
        locale: '{{locale}}'
			};

			window.heyform = heyform;
		})();
	</script>
</head>
<body>
<div id="root"></div>
<div id="loading">
  <svg class="loading-icon" fill="none" style="width:1.25rem; height:1.25rem;" viewBox="0 0 24 24"
       xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      fill="currentColor"></path>
  </svg>
</div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
